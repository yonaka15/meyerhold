[package]
name = "meyerhold"
version = "0.5.0"
edition = "2021"
authors = ["Yoshifumi Nakahira"]
description = "Progressive reader for Playwright MCP snapshot JSON files"
license = "MIT"
repository = "https://github.com/yonaka15/meyerhold"
readme = "README.md"
keywords = ["playwright", "mcp", "snapshot", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"
clap = { version = "4", features = ["derive"] }
thiserror = "1.0"

[lib]
name = "meyerhold"
path = "src/lib.rs"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[[bin]]
name = "meyerhold"
path = "src/main.rs"
